<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercices — StudIA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">
        <span class="brand-mark">S</span>
        <span class="brand-name">StudIA</span>
      </a>
      <nav class="main-nav">
        <a href="index.html">Accueil</a>
        <a href="cours.html">Cours</a>
        <a href="exercices.html" class="active">Exercices</a>
        <a href="assistants.html">Assistants IA</a>
        <a href="tableau-de-bord.html">Tableau de bord</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Changer de thème">🌙</button>
        <a href="assistants.html" class="btn btn-primary">Démarrer</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <span class="eyebrow">S'entraîner</span>
        <h1>Exercices</h1>
        <p class="lead">Travaillez vos exercices avec l'aide d'un assistant IA spécialisé. Cliquez sur « Travailler avec l'IA » pour ouvrir le chat avec le contexte de l'exercice.</p>
      </div>
    </section>

    <section class="container filters">
      <div class="filter-row">
        <input type="search" id="ex-search" placeholder="Rechercher un exercice…" />
        <select id="ex-subject">
          <option value="">Toutes les matières</option>
          <option>Mathématiques</option>
          <option>Physique-Chimie</option>
          <option>Français</option>
          <option>Histoire-Géo</option>
          <option>SVT</option>
          <option>Anglais</option>
          <option>Philosophie</option>
          <option>Informatique</option>
        </select>
        <select id="ex-difficulty">
          <option value="">Toutes difficultés</option>
          <option>Facile</option>
          <option>Moyen</option>
          <option>Difficile</option>
        </select>
      </div>
    </section>

    <section class="container">
      <div class="exercise-list" id="exercise-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container copyright">© 2026 StudIA</div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>renderExercises();</script>
</body>
</html>
